name: Build & Release

# 触发条件：
#   - push 到 main / 任意 PR：只跑单元测试（CI 守门）
#   - 推送 v* 开头的 tag：跑测试 + 打包 zip + 发布 GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1：单元测试（所有触发场景都跑）
  # ─────────────────────────────────────────────
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm test

  # ─────────────────────────────────────────────
  # Job 2：打包并发布（仅在打 tag 时执行）
  #   本项目是 buildless 的 MV3 扩展，源码即产物，
  #   无需编译，只需把扩展运行所需文件压成 zip。
  # ─────────────────────────────────────────────
  release:
    name: 打包并发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 需要写权限
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号（来自 manifest.json）
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 打包扩展为 zip
        run: |
          PKG_NAME="online-video-downloader-v${{ steps.version.outputs.version }}"
          rm -rf "$PKG_NAME"
          mkdir "$PKG_NAME"
          # 只打包扩展运行所需文件，排除 test/ docs/ 配置文件与多语言 README
          cp manifest.json "$PKG_NAME/"
          cp -R background content icons injected lib offscreen popup "$PKG_NAME/"
          zip -r "${PKG_NAME}.zip" "$PKG_NAME"

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: online-video-downloader-v${{ steps.version.outputs.version }}
          path: online-video-downloader-v${{ steps.version.outputs.version }}.zip

      - name: 创建 GitHub Release 并附加 zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "online-video-downloader-v${{ steps.version.outputs.version }}.zip" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
